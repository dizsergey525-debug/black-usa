
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BLACK USA</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#111;font-family:Arial,sans-serif;color:white;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;z-index:5}
#logo{font-size:26px;font-weight:900;color:#ff3030;letter-spacing:3px;text-shadow:0 0 10px #f004}
#panel{margin-top:8px;background:#111d;padding:12px;border-left:3px solid #e33;border-radius:10px;width:190px}
.row{font-size:14px;margin:6px 0}
#money{color:#38ff91;font-weight:bold}
#healthBox{width:155px;height:10px;background:#444;border-radius:8px;margin-top:6px;overflow:hidden}
#health{height:100%;width:100%;background:#ff3333}
#map{position:fixed;top:12px;right:12px;width:120px;height:120px;background:#172019;border:2px solid #e33;border-radius:12px;z-index:5;overflow:hidden}
.mapRoad{position:absolute;background:#444}
#mapDot{position:absolute;width:9px;height:9px;background:#fff;border-radius:50%;left:50%;top:50%;box-shadow:0 0 8px white}
#joy{position:fixed;left:25px;bottom:30px;width:130px;height:130px;border:2px solid #ffffff55;background:#ffffff15;border-radius:50%;z-index:10;touch-action:none}
#stick{position:absolute;width:55px;height:55px;border-radius:50%;background:#e33;border:3px solid #ddd;left:35px;top:35px}
#buttons{position:fixed;right:20px;bottom:35px;display:flex;gap:12px;z-index:10}
.btn{width:72px;height:72px;border-radius:50%;background:#d94343;border:3px solid #ddd;color:white;font-weight:bold;font-size:13px;touch-action:none}
.btn:active{transform:scale(.94);background:#a22}
#msg{position:fixed;top:45%;width:100%;text-align:center;z-index:20;font-size:18px;text-shadow:0 2px 5px black;pointer-events:none}
#loading{position:fixed;inset:0;background:#101318;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center}
#loadTitle{font-size:35px;font-weight:900;color:#f33;letter-spacing:5px}
#loadBar{width:220px;height:8px;background:#333;margin-top:25px;border-radius:10px;overflow:hidden}
#loadFill{height:100%;width:0;background:#f33}
#loadText{margin-top:12px;color:#aaa;font-size:12px}
</style>
</head>

<body>
<div id="game"></div>

<div id="hud">
  <div id="logo">BLACK USA</div>
  <div id="panel">
    <div class="row">Игрок: <b>Игрок</b></div>
    <div class="row">Уровень: <b id="level">1</b></div>
    <div class="row">Деньги: <b id="money">1 000 $</b></div>
    <div class="row">HP: <b id="hp">100</b></div>
    <div id="healthBox"><div id="health"></div></div>
  </div>
</div>

<div id="map">
  <div class="mapRoad" style="width:100%;height:8px;top:46%"></div>
  <div class="mapRoad" style="width:8px;height:100%;left:46%"></div>
  <div id="mapDot"></div>
</div>

<div id="joy">
  <div id="stick"></div>
</div>

<div id="buttons">
  <button class="btn" id="jump">ПРЫЖОК</button>
  <button class="btn" id="run">БЕГ</button>
</div>

<div id="msg"></div>

<div id="loading">
  <div id="loadTitle">BLACK USA</div>
  <div id="loadBar"><div id="loadFill"></div></div>
  <div id="loadText">ЗАГРУЗКА ГОРОДА...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* =================================
   BLACK USA 3D
   ================================= */

const GAME={
 version:"0.2",
 money:1000,
 level:1,
 hp:100,
 maxHp:100
};

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b3ce);
scene.fog=new THREE.Fog(0x91b3ce,150,1500);

const camera=new THREE.PerspectiveCamera(
  70,window.innerWidth/window.innerHeight,0.1,2500
);

const renderer=new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1));
document.getElementById("game").appendChild(renderer.domElement);

/* LIGHT */

scene.add(new THREE.AmbientLight(0xffffff,1));

const sun=new THREE.DirectionalLight(0xffffff,1);
sun.position.set(200,300,100);
scene.add(sun);

/* GROUND */

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(3000,3000),
 new THREE.MeshLambertMaterial({color:0x63845e})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

/* ROADS */

function road(x,z,w,l,rotation=0){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,0.12,l),
  new THREE.MeshLambertMaterial({color:0x292d32})
 );
 mesh.position.set(x,0.02,z);
 mesh.rotation.y=rotation;
 scene.add(mesh);
}

road(0,0,24,3000);
road(250,0,20,3000);
road(-250,0,20,3000);
road(0,250,3000,20,Math.PI/2);
road(0,-250,3000,20,Math.PI/2);

/* ROAD MARKINGS */

function markings(x,z,length,vertical=true){
 for(let i=-length/2;i<length/2;i+=35){
  const line=new THREE.Mesh(
   new THREE.BoxGeometry(0.7,0.15,12),
   new THREE.MeshBasicMaterial({color:0xe5e5b8})
  );
  if(vertical){
   line.position.set(x,0.1,z+i);
  }else{
   line.position.set(x+i,0.1,z);
   line.rotation.y=Math.PI/2;
  }
  scene.add(line);
 }
}

markings(0,0,3000,true);
markings(0,250,3000,false);
markings(0,-250,3000,false);

/* BUILDINGS */

const colors=[
 0x858b95,0x9b9286,0x6b7885,
 0x777777,0x8c8174,0x596570,0xa09a90
];

function building(x,z){
 const w=25+Math.random()*35;
 const d=25+Math.random()*35;
 const h=20+Math.random()*160;

 const material=new THREE.MeshLambertMaterial({
  color:colors[Math.floor(Math.random()*colors.length)]
 });

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material
 );
 body.position.set(x,h/2,z);
 scene.add(body);

 // Roof
 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(w+1,2,d+1),
  new THREE.MeshLambertMaterial({color:0x444444})
 );
 roof.position.set(x,h+1,z);
 scene.add(roof);

 // Windows
 const windowMaterial=new THREE.MeshBasicMaterial({color:0x9bc7db});
 for(let y=8;y<h-5;y+=12){
  for(let wx=-w/2+5;wx<w/2-3;wx+=9){
   const win=new THREE.Mesh(
    new THREE.BoxGeometry(3,4,0.3),windowMaterial
   );
   win.position.set(x+wx,y,z+d/2+0.2);
   scene.add(win);
  }
 }
}

// Размещаем здания в кварталах
for(let x=-1200;x<=1200;x+=100){
 for(let z=-1200;z<=1200;z+=100){
  if(Math.abs(x)<45||Math.abs(z)<45)continue;
  if(Math.abs(x-250)<35||Math.abs(x+250)<35)continue;
  if(Math.abs(z-250)<35||Math.abs(z+250)<35)continue;
  if(Math.random()<0.75)building(x+(Math.random()-0.5)*35,z+(Math.random()-0.5)*35);
 }
}

/* =================================
   HUMAN PLAYER MODEL
   ================================= */

const player=new THREE.Group();

const skin=new THREE.MeshLambertMaterial({color:0xd9a27d});
const shirt=new THREE.MeshLambertMaterial({color:0x263d72});
const pants=new THREE.MeshLambertMaterial({color:0x292c35});
const shoes=new THREE.MeshLambertMaterial({color:0x171717});

function part(w,h,d,material,x,y,z){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);
 player.add(mesh);
 return mesh;
}

// Торс
part(0.75,0.95,0.4,shirt,0,1.45,0);

// Голова
part(0.42,0.48,0.42,skin,0,2.2,0);

// Шея
part(0.2,0.18,0.2,skin,0,1.97,0);

// Руки
const leftArm=new THREE.Group();
leftArm.position.set(-0.48,1.78,0);
player.add(leftArm);

const armL=new THREE.Mesh(
 new THREE.BoxGeometry(0.22,0.72,0.24),shirt
);
armL.position.y=-0.28;
leftArm.add(armL);

const handL=new THREE.Mesh(
 new THREE.BoxGeometry(0.2,0.2,0.22),skin
);
handL.position.y=-0.68;
leftArm.add(handL);

const rightArm=new THREE.Group();
rightArm.position.set(0.48,1.78,0);
player.add(rightArm);

const armR=new THREE.Mesh(
 new THREE.BoxGeometry(0.22,0.72,0.24),shirt
);
armR.position.y=-0.28;
rightArm.add(armR);

const handR=new THREE.Mesh(
 new THREE.BoxGeometry(0.2,0.2,0.22),skin
);
handR.position.y=-0.68;
rightArm.add(handR);

// Ноги
const leftLeg=new THREE.Group();
leftLeg.position.set(-0.2,0.95,0);
player.add(leftLeg);

partLocal(leftLeg,0.28,0.75,0.3,pants,0,-0.35,0);
partLocal(leftLeg,0.3,0.2,0.42,shoes,0,-0.75,0.04);

const rightLeg=new THREE.Group();
rightLeg.position.set(0.2,0.95,0);
player.add(rightLeg);

partLocal(rightLeg,0.28,0.75,0.3,pants,0,-0.35,0);
partLocal(rightLeg,0.3,0.2,0.42,shoes,0,-0.75,0.04);

function partLocal(parent,w,h,d,mat,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

scene.add(player);
player.position.set(0,0,0);

/* =================================
   MOVEMENT
   ================================= */

let moveX=0;
let moveZ=0;
let velocityY=0;
let jumping=false;
let running=false;
let walkTime=0;
const walkSpeed=0.075;
const runSpeed=0.14;
const gravity=0.018;

function movement(){
 const magnitude=Math.sqrt(moveX*moveX+moveZ*moveZ);

 if(magnitude>0.05){
  const speed=running?runSpeed:walkSpeed;

  player.position.x+=moveX*speed;
  player.position.z+=moveZ*speed;

  player.rotation.y=Math.atan2(moveX,moveZ);

  walkTime+=running?0.25:0.15;

  leftLeg.rotation.x=Math.sin(walkTime)*0.5;
  rightLeg.rotation.x=-Math.sin(walkTime)*0.5;
  leftArm.rotation.x=-Math.sin(walkTime)*0.4;
  rightArm.rotation.x=Math.sin(walkTime)*0.4;
 }else{
  leftLeg.rotation.x*=0.85;
  rightLeg.rotation.x*=0.85;
  leftArm.rotation.x*=0.85;
  rightArm.rotation.x*=0.85;
 }

 player.position.y+=velocityY;

 if(jumping)velocityY-=gravity;

 if(player.position.y<=0){
  player.position.y=0;
  velocityY=0;
  jumping=false;
 }
}

/* =================================
   JOYSTICK
   ================================= */

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

let active=false;
let centerX=0;
let centerY=0;

function joyStart(e){
 e.preventDefault();
 active=true;

 const rect=joy.getBoundingClientRect();
 centerX=rect.left+rect.width/2;
 centerY=rect.top+rect.height/2;

 joyMove(e);
}

function joyMove(e){
 if(!active)return;

 const dx=e.clientX-centerX;
 const dy=e.clientY-centerY;
 const limit=38;

 const distance=Math.sqrt(dx*dx+dy*dy);
 const angle=Math.atan2(dy,dx);
 const dist=Math.min(distance,limit);

 stick.style.left=(35+Math.cos(angle)*dist)+"px";
 stick.style.top=(35+Math.sin(angle)*dist)+"px";

 moveX=dx/limit;
 moveZ=dy/limit;

 const mag=Math.sqrt(moveX*moveX+moveZ*moveZ);
 if(mag>1){
  moveX/=mag;
  moveZ/=mag;
 }
}

function joyEnd(){
 active=false;
 moveX=0;
 moveZ=0;
 stick.style.left="35px";
 stick.style.top="35px";
}

joy.addEventListener("pointerdown",joyStart);
window.addEventListener("pointermove",joyMove);
window.addEventListener("pointerup",joyEnd);
window.addEventListener("pointercancel",joyEnd);

/* RUN */

const runButton=document.getElementById("run");

runButton.addEventListener("pointerdown",e=>{
 e.preventDefault();
 running=true;
});

runButton.addEventListener("pointerup",()=>running=false);
runButton.addEventListener("pointercancel",()=>running=false);
runButton.addEventListener("pointerleave",()=>running=false);

/* JUMP */

function jump(){
 if(!jumping){
  jumping=true;
  velocityY=0.32;
 }
}

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 jump();
});

/* =================================
   CAMERA
   ================================= */

function cameraUpdate(){
 const distance=9;
 const height=5;

 const behindX=Math.sin(player.rotation.y)*distance;
 const behindZ=Math.cos(player.rotation.y)*distance;

 camera.position.x=player.position.x-behindX;
 camera.position.y=player.position.y+height;
 camera.position.z=player.position.z-behindZ;

 camera.lookAt(
  player.position.x,
  player.position.y+1.2,
  player.position.z
 );
}

/* =================================
   HUD
   ================================= */

function hudUpdate(){
 document.getElementById("money").textContent=
 GAME.money.toLocaleString("ru-RU")+" $";

 document.getElementById("level").textContent=GAME.level;
 document.getElementById("hp").textContent=GAME.hp;

 document.getElementById("health").style.width=
 (GAME.hp/GAME.maxHp*100)+"%";
}

function mapUpdate(){
 const dot=document.getElementById("mapDot");

 const x=player.position.x/3000*100;
 const z=player.position.z/3000*100;

 dot.style.left=(50+x)+"%";
 dot.style.top=(50+z)+"%";
}

/* =================================
   LOADING SCREEN
   ================================= */

let progress=0;

const loadTimer=setInterval(()=>{
 progress+=Math.random()*10+3;

 if(progress>=100){
  progress=100;
  clearInterval(loadTimer);

  document.getElementById("loadText").textContent="ГОТОВО";

  setTimeout(()=>{
   document.getElementById("loading").style.display="none";
   message("Добро пожаловать в BLACK USA!");
  },500);
 }

 document.getElementById("loadFill").style.width=progress+"%";
},180);

function message(text){
 const msg=document.getElementById("msg");
 msg.textContent=text;

 setTimeout(()=>msg.textContent="",2500);
}

/* =================================
   KEYBOARD
   ================================= */

window.addEventListener("keydown",e=>{
 if(e.key==="w"||e.key==="ArrowUp")moveZ=-1;
 if(e.key==="s"||e.key==="ArrowDown")moveZ=1;
 if(e.key==="a"||e.key==="ArrowLeft")moveX=-1;
 if(e.key==="d"||e.key==="ArrowRight")moveX=1;
 if(e.key===" ")jump();
 if(e.shiftKey)running=true;
});

window.addEventListener("keyup",e=>{
 moveX=0;
 moveZ=0;
 if(e.key==="Shift")running=false;
});

/* =================================
   RESIZE
   ================================= */

window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

/* =================================
   GAME LOOP
   ================================= */

function animate(){
 requestAnimationFrame(animate);

 movement();
 cameraUpdate();
 hudUpdate();
 mapUpdate();

 renderer.render(scene,camera);
}

animate();

console.log("BLACK USA",GAME.version,"STARTED");
</script>
</body>
</html>
