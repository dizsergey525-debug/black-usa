<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLACK USA 3D</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080b10;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    user-select: none;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #ff3030;
    text-shadow: 0 0 15px #ff000080;
}

.stats {
    margin-top: 10px;
    background: rgba(0,0,0,.65);
    padding: 12px;
    border-radius: 12px;
    border-left: 3px solid #ff3030;
    width: 180px;
}

.stat {
    margin: 5px 0;
    font-size: 14px;
}

.money {
    color: #39ff91;
    font-weight: bold;
}

#healthContainer {
    width: 150px;
    height: 9px;
    background: #333;
    border-radius: 10px;
    margin-top: 5px;
    overflow: hidden;
}

#health {
    width: 100%;
    height: 100%;
    background: #ff3030;
    transition: width .3s;
}

#map {
    position: fixed;
    top: 15px;
    right: 15px;
    width: 125px;
    height: 125px;
    background: rgba(5,10,15,.85);
    border: 2px solid #ff3030;
    border-radius: 12px;
    z-index: 10;
}

#mapPlayer {
    position: absolute;
    width: 8px;
    height: 8px;
    background: white;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    box-shadow: 0 0 10px white;
}

#controls {
    position: fixed;
    bottom: 25px;
    left: 25px;
    z-index: 20;
}

.joystick {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: rgba(255,255,255,.1);
    border: 2px solid rgba(255,255,255,.25);
    position: relative;
    touch-action: none;
}

#stick {
    position: absolute;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: rgba(255,50,50,.8);
    border: 2px solid white;
    left: 33px;
    top: 33px;
}

#buttons {
    position: fixed;
    right: 25px;
    bottom: 30px;
    z-index: 20;
    display: flex;
    gap: 12px;
    align-items: flex-end;
}

.gameButton {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: rgba(255,40,40,.7);
    border: 2px solid white;
    color: white;
    font-size: 14px;
    font-weight: bold;
    touch-action: none;
}

.gameButton:active {
    background: red;
    transform: scale(.9);
}

#message {
    position: fixed;
    bottom: 180px;
    width: 100%;
    text-align: center;
    font-size: 16px;
    color: white;
    z-index: 30;
    text-shadow: 0 2px 5px black;
    pointer-events: none;
}

#loading {
    position: fixed;
    inset: 0;
    background: #080b10;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.loadingLogo {
    font-size: 35px;
    font-weight: 900;
    color: #ff3030;
    letter-spacing: 5px;
}

.loadingBar {
    width: 220px;
    height: 8px;
    background: #222;
    margin-top: 25px;
    border-radius: 10px;
    overflow: hidden;
}

#loadingProgress {
    width: 0%;
    height: 100%;
    background: #ff3030;
}

#loadingText {
    margin-top: 12px;
    color: #888;
    font-size: 12px;
}

</style>
</head>

<body>

<div id="loading">
    <div class="loadingLogo">BLACK USA</div>
    <div class="loadingBar">
        <div id="loadingProgress"></div>
    </div>
    <div id="loadingText">ЗАГРУЗКА ГОРОДА...</div>
</div>

<div id="game"></div>

<div id="hud">
    <div class="logo">BLACK USA</div>

    <div class="stats">
        <div class="stat">Игрок: <b>Коулен</b></div>
        <div class="stat">Уровень: <b id="level">1</b></div>
        <div class="stat">Деньги: <span class="money" id="money">1 000 $</span></div>
        <div class="stat">HP: <b id="hpText">100</b></div>

        <div id="healthContainer">
            <div id="health"></div>
        </div>
    </div>
</div>

<div id="map">
    <div id="mapPlayer"></div>
</div>

<div id="controls">
    <div class="joystick" id="joystick">
        <div id="stick"></div>
    </div>
</div>

<div id="buttons">
    <button class="gameButton" id="jump">ПРЫЖОК</button>
    <button class="gameButton" id="run">БЕГ</button>
</div>

<div id="message"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* ===============================
   BLACK USA 3D
   GAME ENGINE
================================ */

const GAME = {
    name: "BLACK USA",
    version: "0.1",
    player: {
        name: "Коулен",
        level: 1,
        money: 1000,
        hp: 100,
        maxHp: 100
    },
    world: {
        size: 3000,
        buildings: 100,
        roads: 8
    }
};

/* ===============================
   THREE.JS
================================ */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a9c4);
scene.fog = new THREE.Fog(0x87a9c4, 100, 1200);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    3000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = false;

document.getElementById("game").appendChild(renderer.domElement);

/* ===============================
   LIGHT
================================ */

const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);

const sunlight = new THREE.DirectionalLight(0xffffff, 1);
sunlight.position.set(300, 500, 200);
scene.add(sunlight);

/* ===============================
   GROUND
================================ */

const groundGeometry = new THREE.PlaneGeometry(3000, 3000);
const groundMaterial = new THREE.MeshLambertMaterial({
    color: 0x4c7051
});

const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.1;
scene.add(ground);

/* ===============================
   ROADS
================================ */

function createRoad(x, z, width, length, rotation = 0) {
    const geometry = new THREE.BoxGeometry(width, 0.1, length);

    const material = new THREE.MeshLambertMaterial({
        color: 0x25282c
    });

    const road = new THREE.Mesh(geometry, material);
    road.position.set(x, 0.01, z);
    road.rotation.y = rotation;
    scene.add(road);

    // Разметка
    for (let i = -length / 2; i < length / 2; i += 30) {
        const line = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.12, 10),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );

        line.position.set(x, 0.08, z + i);
        scene.add(line);
    }
}

// Главные дороги
createRoad(0, 0, 24, 3000);
createRoad(200, 0, 18, 3000);
createRoad(-200, 0, 18, 3000);
createRoad(0, 200, 3000, 18, Math.PI / 2);
createRoad(0, -200, 3000, 18, Math.PI / 2);

/* ===============================
   BUILDINGS
================================ */

const buildingColors = [
    0x777777,
    0x888899,
    0x555566,
    0x997766,
    0x666677,
    0x444455,
    0x999999
];

function createBuilding(x, z) {
    const width = 30 + Math.random() * 30;
    const depth = 30 + Math.random() * 30;
    const height = 30 + Math.random() * 180;

    const geometry = new THREE.BoxGeometry(width, height, depth);

    const material = new THREE.MeshLambertMaterial({
        color: buildingColors[
            Math.floor(Math.random() * buildingColors.length)
        ]
    });

    const building = new THREE.Mesh(geometry, material);

    building.position.set(x, height / 2, z);
    scene.add(building);

    // Крыша
    const roof = new THREE.Mesh(
        new THREE.BoxGeometry(width + 1, 2, depth + 1),
        new THREE.MeshLambertMaterial({ color: 0x333333 })
    );

    roof.position.set(x, height + 1, z);
    scene.add(roof);
}

for (let i = 0; i < 100; i++) {
    const x = (Math.random() - 0.5) * 2500;
    const z = (Math.random() - 0.5) * 2500;

    // Не ставим дома прямо на главные дороги
    if (Math.abs(x) < 40 || Math.abs(z) < 40) continue;

    createBuilding(x, z);
}

/* ===============================
   PLAYER
================================ */

const player = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.BoxGeometry(1, 2, 1),
    new THREE.MeshLambertMaterial({ color: 0x2255ff })
);

body.position.y = 1;
player.add(body);

const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 0.7, 0.7),
    new THREE.MeshLambertMaterial({ color: 0xffcc99 })
);

head.position.y = 2.35;
player.add(head);

scene.add(player);
player.position.set(0, 0, 0);

/* ===============================
   MOVEMENT
================================ */

let moveX = 0;
let moveZ = 0;
let speed = 0.8;
let isRunning = false;
let velocityY = 0;
let isJumping = false;

const gravity = 0.025;

function movePlayer() {
    player.position.x += moveX * speed;
    player.position.z += moveZ * speed;

    if (moveX !== 0 || moveZ !== 0) {
        player.rotation.y = Math.atan2(moveX, moveZ);
    }

    // Прыжок
    player.position.y += velocityY;

    if (isJumping) {
        velocityY -= gravity;
    }

    if (player.position.y <= 0) {
        player.position.y = 0;
        velocityY = 0;
        isJumping = false;
    }
}

/* ===============================
   JOYSTICK
================================ */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickActive = false;
let joystickCenterX = 0;
let joystickCenterY = 0;

joystick.addEventListener("touchstart", function(e) {
    e.preventDefault();

    joystickActive = true;

    const rect = joystick.getBoundingClientRect();

    joystickCenterX = rect.left + rect.width / 2;
    joystickCenterY = rect.top + rect.height / 2;

    joystickMove(e.touches[0]);
}, { passive: false });

joystick.addEventListener("touchmove", function(e) {
    e.preventDefault();

    if (!joystickActive) return;

    joystickMove(e.touches[0]);
}, { passive: false });

window.addEventListener("touchend", function() {
    joystickActive = false;
    moveX = 0;
    moveZ = 0;

    stick.style.left = "33px";
    stick.style.top = "33px";
});

function joystickMove(touch) {
    const dx = touch.clientX - joystickCenterX;
    const dy = touch.clientY - joystickCenterY;

    const maxDistance = 35;

    const distance = Math.sqrt(dx * dx + dy * dy);
    const angle = Math.atan2(dy, dx);

    const limitedDistance = Math.min(distance, maxDistance);

    const px = Math.cos(angle) * limitedDistance;
    const py = Math.sin(angle) * limitedDistance;

    stick.style.left = (33 + px) + "px";
    stick.style.top = (33 + py) + "px";

    moveX = dx / maxDistance;
    moveZ = dy / maxDistance;

    const magnitude = Math.sqrt(moveX * moveX + moveZ * moveZ);

    if (magnitude > 1) {
        moveX /= magnitude;
        moveZ /= magnitude;
    }
}

/* ===============================
   RUN BUTTON
================================ */

const runButton = document.getElementById("run");

runButton.addEventListener("touchstart", function(e) {
    e.preventDefault();
    isRunning = true;
    speed = 1.5;
});

runButton.addEventListener("touchend", function() {
    isRunning = false;
    speed = 0.8;
});

runButton.addEventListener("mousedown", function() {
    isRunning = true;
    speed = 1.5;
});

runButton.addEventListener("mouseup", function() {
    isRunning = false;
    speed = 0.8;
});

/* ===============================
   JUMP
================================ */

const jumpButton = document.getElementById("jump");

function jump() {
    if (!isJumping) {
        isJumping = true;
        velocityY = 0.45;
    }
}

jumpButton.addEventListener("touchstart", function(e) {
    e.preventDefault();
    jump();
});

jumpButton.addEventListener("click", jump);

/* ===============================
   CAMERA
================================ */

function updateCamera() {
    const distance = 12;
    const height = 7;

    const targetX = player.position.x;
    const targetZ = player.position.z;

    const behindX = Math.sin(player.rotation.y) * distance;
    const behindZ = Math.cos(player.rotation.y) * distance;

    camera.position.x = targetX - behindX;
    camera.position.y = player.position.y + height;
    camera.position.z = targetZ - behindZ;

    camera.lookAt(
        player.position.x,
        player.position.y + 1,
        player.position.z
    );
}

/* ===============================
   HUD UPDATE
================================ */

function updateHUD() {
    document.getElementById("level").textContent =
        GAME.player.level;

    document.getElementById("money").textContent =
        GAME.player.money.toLocaleString("ru-RU") + " $";

    document.getElementById("hpText").textContent =
        GAME.player.hp;

    document.getElementById("health").style.width =
        (GAME.player.hp / GAME.player.maxHp * 100) + "%";
}

/* ===============================
   MESSAGE
================================ */

function showMessage(text) {
    const message = document.getElementById("message");

    message.textContent = text;

    setTimeout(() => {
        message.textContent = "";
    }, 2500);
}

/* ===============================
   MAP
================================ */

function updateMap() {
    const mapPlayer = document.getElementById("mapPlayer");

    const mapX = player.position.x / 3000 * 100;
    const mapZ = player.position.z / 3000 * 100;

    mapPlayer.style.left = (50 + mapX) + "%";
    mapPlayer.style.top = (50 + mapZ) + "%";
}

/* ===============================
   LOADING
================================ */

let loadingValue = 0;

const loadingInterval = setInterval(() => {
    loadingValue += Math.random() * 12;

    if (loadingValue >= 100) {
        loadingValue = 100;

        clearInterval(loadingInterval);

        document.getElementById("loadingText").textContent =
            "ГОТОВО";

        setTimeout(() => {
            document.getElementById("loading").style.display = "none";
            showMessage("Добро пожаловать в BLACK USA!");
        }, 500);
    }

    document.getElementById("loadingProgress").style.width =
        loadingValue + "%";
}, 150);

/* ===============================
   GAME LOOP
================================ */

function animate() {
    requestAnimationFrame(animate);

    movePlayer();
    updateCamera();
    updateHUD();
    updateMap();

    renderer.render(scene, camera);
}

animate();

/* ===============================
   RESIZE
================================ */

window.addEventListener("resize", function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ===============================
   KEYBOARD
================================ */

window.addEventListener("keydown", function(e) {
    if (e.key === "w" || e.key === "ArrowUp") moveZ = -1;
    if (e.key === "s" || e.key === "ArrowDown") moveZ = 1;
    if (e.key === "a" || e.key === "ArrowLeft") moveX = -1;
    if (e.key === "d" || e.key === "ArrowRight") moveX = 1;

    if (e.key === " ") jump();
});

window.addEventListener("keyup", function(e) {
    moveX = 0;
    moveZ = 0;
});

/* ===============================
   START
================================ */

console.log("BLACK USA 3D ENGINE STARTED");
console.log("Version:", GAME.version);
console.log("Player:", GAME.player.name);
console.log("World:", GAME.world.size);

</script>

</body>
</html>
